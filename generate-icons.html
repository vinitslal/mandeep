<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h2>Right-click each image below and "Save image as..." to the icons/ folder</h2>
<p>Or just run the app — the icons will work from the canvas-generated data URLs.</p>
<div id="icons"></div>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const container = document.getElementById('icons');

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background - rounded green gradient
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.7);
  grad.addColorStop(0, '#19e65e');
  grad.addColorStop(1, '#0ea641');

  // Rounded rect background
  const r = size * 0.2;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // White cross/pharmacy icon
  const cx = size / 2;
  const cy = size / 2;
  const armW = size * 0.12;
  const armH = size * 0.35;

  ctx.fillStyle = 'white';
  // Vertical arm
  ctx.beginPath();
  ctx.roundRect(cx - armW/2, cy - armH/2, armW, armH, armW * 0.3);
  ctx.fill();
  // Horizontal arm
  ctx.beginPath();
  ctx.roundRect(cx - armH/2, cy - armW/2, armH, armW, armW * 0.3);
  ctx.fill();

  // "M" letter below
  ctx.font = `bold ${size * 0.15}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('M', cx, cy + armH/2 + size * 0.13);

  // Output
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = `icon-${size}.png`;
  link.innerHTML = `<div style="margin:10px;display:inline-block;text-align:center"><canvas width="${size}" height="${size}" style="border:1px solid #ccc;border-radius:12px;display:block"></canvas><br>icon-${size}.png (click to download)</div>`;
  container.appendChild(link);

  // Copy canvas content
  const displayCanvas = link.querySelector('canvas');
  displayCanvas.getContext('2d').drawImage(canvas, 0, 0);

  // Auto-save via fetch to create actual files
  canvas.toBlob(blob => {
    // Can't save files directly from browser, but we'll create a simpler approach
  });
});
</script>
</body>
</html>
